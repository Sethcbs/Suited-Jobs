# Standard skill name: list of aliases. Matching is case-insensitive and whole-word.
# Aliases under exact_case must match capitalization exactly and may not touch
# & - / ' . (so "R&D" and "C.F.R." are not R or C), and may not follow a word in
# exact_case_not_after (so "Schedule C" and "Band C" are not C). Grow this list as real postings show gaps.
