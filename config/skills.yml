# Standard skill name: list of aliases. Matching is case-insensitive and whole-word.
# Aliases under exact_case must match capitalization exactly and may not touch
# & - / ' . (so "R&D" and "C.F.R." are not R or C), and may not follow a word in
# exact_case_not_after (so "Schedule C" and "Band C" are not C). Grow this list as real postings show gaps.
skills:
  Python: [python]
  Java: [java]
  JavaScript: [javascript, js]
  TypeScript: [typescript]
  C++: [c++]
  C#: [c#]
  .NET: [.net, asp.net, dotnet]
  Go: [golang, go language]
  PHP: [php]
  Kotlin: [kotlin]
  Scala: [scala]
  MATLAB: [matlab]
  SQL: [sql]
  PostgreSQL: [postgresql, postgres]
  MySQL: [mysql]
  Oracle: [oracle]
  SQL Server: [sql server, mssql]
  MongoDB: [mongodb]
  Redis: [redis]
  HTML: [html]
  CSS: [css]
  React: [react, react.js, reactjs]
  Angular: [angular]
  Vue: [vue, vue.js]
  Node.js: [node.js, nodejs]
  Django: [django]
  Flask: [flask]
  Spring: [spring boot, spring framework]
  AWS: [aws, amazon web services]
  Azure: [azure]
  GCP: [gcp, google cloud]
  Docker: [docker]
  Kubernetes: [kubernetes, k8s]
  Terraform: [terraform]
  Ansible: [ansible]
  Linux: [linux, unix]
  Windows Server: [windows server]
  Git: [git, github, gitlab]
  CI/CD: [ci/cd, continuous integration, jenkins]
  Agile: [agile, scrum]
  REST APIs: [rest api, rest apis, restful]
  Machine Learning: [machine learning]
  Data Analysis: [data analysis, data analytics]
  Tableau: [tableau]
  Power BI: [power bi]
  SharePoint: [sharepoint]
  Salesforce: [salesforce]
  ServiceNow: [servicenow]
  Cybersecurity: [cybersecurity, cyber security, information security]
  Networking: [tcp/ip, network administration, networking]
  Project Management: [project management, pmp]
  Requirements Management: [requirements management]
exact_case:
  C: [C]
  R: [R]
  Rust: [Rust]
  Ruby: [Ruby]
  Swift: [Swift]
  Excel: [Excel]
exact_case_not_after: [Schedule, Band, Team, Part, Grade, Appendix, Category, Section,
                       Title, Class, Tier, Level, Phase, Group, Unit, Step, Option, Plan]
# A job stays in the CSV if it has a skill not listed under general, or if its title
# matches tech_titles. General skills are still tagged but don't qualify a job alone.
general: [Excel, Project Management, Data Analysis, Agile, SharePoint, Salesforce,
          Requirements Management]
tech_titles: [information technology, software, developer, programmer, computer,
              data engineer, data engineering, data scientist, database, devops,
              site reliability, technical program manager,
              network engineer, network administrator, systems administrator,
              system administrator, systems engineer, security engineer, cloud engineer,
              ai engineer, ml engineer, web]
tech_titles_exact_case: [IT, AI]
